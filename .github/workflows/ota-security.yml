name: OTA signing and cloud recovery checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-crypto:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject wrong passwords, tampered backups and unsafe signing identities
        shell: pwsh
        run: ./scripts/test-ota-key-crypto.ps1

  publisher-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build in GitHub and run only the publisher boundary regressions
        shell: pwsh
        run: |
          dotnet restore OpticalSystemDesign.slnx --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build OpticalSystemDesign.slnx -c Release --no-restore /m:1 /nr:false
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test tests/OpticalSystemDesign.Tests/OpticalSystemDesign.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~CloudReleaseTests|FullyQualifiedName~ReleaseUpdateTests|FullyQualifiedName~AboutUpdateTests' --logger 'trx;LogFileName=ota-publisher.trx' --results-directory artifacts/ota-checks
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ota-publisher-checks
          path: artifacts/ota-checks
          if-no-files-found: warn
