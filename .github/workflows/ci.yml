name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore OptilandWorkbench.slnx --locked-mode -p:ContinuousIntegrationBuild=true

      - name: Build
        run: dotnet build OptilandWorkbench.slnx --no-restore /m:1 /nr:false -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test tests/OptilandWorkbench.Tests/OptilandWorkbench.Tests.csproj --no-build /m:1 /nr:false

  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore OptilandWorkbench.slnx --locked-mode -p:ContinuousIntegrationBuild=true

      - name: Verify formatting
        run: dotnet format OptilandWorkbench.slnx --no-restore --verify-no-changes

      - name: Validate shell scripts
        run: |
          bash -n Run-Optiland.command
          bash -n scripts/publish-cross-platform.sh
