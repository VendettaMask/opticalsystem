name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: read

env:
  CONFIGURATION: Release
  DOTNET_CI_ARGS: -p:ContinuousIntegrationBuild=true
  MAIN_SOLUTION: OpticalSystemDesign.slnx
  MAIN_TEST_PROJECT: tests/OpticalSystemDesign.Tests/OpticalSystemDesign.Tests.csproj
  COMPARISON_TEST_PROJECT: tests/OpticalSystemDesign.ZemaxComparison.Tests/OpticalSystemDesign.ZemaxComparison.Tests.csproj
  MAIN_TEST_HANG_TIMEOUT: 30m
  LAB_TEST_PROJECT: labs/InitialStructure/tests/OpticalSystemDesign.InitialStructure.Tests/OpticalSystemDesign.InitialStructure.Tests.csproj
  COATING_TEST_PROJECT: labs/CoatingDesign/tests/OpticalSystemDesign.CoatingDesign.Tests/OpticalSystemDesign.CoatingDesign.Tests.csproj
  LAB_TEST_HANG_TIMEOUT: 35m

jobs:
  frozen-evidence:
    name: Frozen evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Verify working and committed frozen bytes
        shell: pwsh
        run: |
          $evidence = Join-Path '${{ runner.temp }}' 'frozen-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          ./tools/validation/GitFrozenIntegrity.ps1 -RepositoryRoot . -ManifestPath ./artifacts/validation/n02-layer-diagnosis-20261009/frozen-after.json -ExpectedAggregateSha256 3a5fde98e1c881700f00be1c62d6ab4ff6f4feacc90454046ed787e80bf28c10 -RelocationMapPath tools/validation/frozen-evidence-relocations.json -ExpectedRelocationMapSha256 6eefb25cbb1c35a120f73e8bbb761aac16759e7b8491b4606475caec8dfd4f6e -OutputPath (Join-Path $evidence 'integrity.json')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test Git frozen-byte checks
        shell: pwsh
        run: |
          ./tools/validation/FrozenIntegrity.Tests.ps1 -OutputDirectory (Join-Path '${{ runner.temp }}' 'frozen-working-tests')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/validation/GitFrozenIntegrity.Tests.ps1 -OutputDirectory (Join-Path '${{ runner.temp }}' 'frozen-evidence-tests')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify consolidated evidence and test alias guards
        shell: pwsh
        run: |
          ./tools/validation/EvidenceAliases.ps1 -OutputPath (Join-Path '${{ runner.temp }}' 'frozen-evidence/aliases.json')
          ./tools/validation/EvidenceAliases.Tests.ps1 -OutputDirectory (Join-Path '${{ runner.temp }}' 'evidence-alias-tests')

      - name: Upload frozen-byte results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frozen-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/frozen-evidence
            ${{ runner.temp }}/frozen-working-tests/results.json
            ${{ runner.temp }}/frozen-evidence-tests/results.json
            ${{ runner.temp }}/evidence-alias-tests/results.json
          if-no-files-found: warn

  documentation:
    name: Documentation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Verify documentation links and current-guide duplication
        shell: pwsh
        run: |
          ./scripts/verify-documentation.ps1 -Strict -OutputPath (Join-Path '${{ runner.temp }}' 'documentation/audit.json')

      - name: Test documentation checker
        shell: pwsh
        run: |
          ./scripts/tests/verify-documentation.tests.ps1 -OutputPath (Join-Path '${{ runner.temp }}' 'documentation/tests.json')

      - name: Upload documentation results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ matrix.os }}
          path: ${{ runner.temp }}/documentation
          if-no-files-found: warn

  build-main:
    name: Build main
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore ${{ env.MAIN_SOLUTION }} --locked-mode ${{ env.DOTNET_CI_ARGS }}

      - name: Build main solution
        run: dotnet build ${{ env.MAIN_SOLUTION }} -c ${{ env.CONFIGURATION }} --no-restore /m:1 /nr:false ${{ env.DOTNET_CI_ARGS }}

  test-main:
    name: Main tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore ${{ env.MAIN_SOLUTION }} --locked-mode ${{ env.DOTNET_CI_ARGS }}

      - name: Build main solution
        run: dotnet build ${{ env.MAIN_SOLUTION }} -c ${{ env.CONFIGURATION }} --no-restore /m:1 /nr:false ${{ env.DOTNET_CI_ARGS }}

      - name: Test main solution
        run: >-
          dotnet test
          ${{ env.MAIN_TEST_PROJECT }}
          -c ${{ env.CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=main-${{ matrix.label }}.trx"
          --results-directory "${{ runner.temp }}/test-results/main"
          --blame-hang --blame-hang-timeout ${{ env.MAIN_TEST_HANG_TIMEOUT }}
          /m:1 /nr:false

      - name: Test portable Zemax comparison (no licensed application)
        if: ${{ always() }}
        run: >-
          dotnet test
          ${{ env.COMPARISON_TEST_PROJECT }}
          -c ${{ env.CONFIGURATION }}
          --no-build --no-restore
          --logger "trx;LogFileName=comparison-${{ matrix.label }}.trx"
          --results-directory "${{ runner.temp }}/test-results/main"
          --blame-hang --blame-hang-timeout 30m
          /m:1 /nr:false

      - name: Upload main test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-main-${{ matrix.label }}
          path: ${{ runner.temp }}/test-results/main
          if-no-files-found: warn

  test-lab:
    name: Built-in module tests (${{ matrix.os }}, ${{ matrix.partition }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        partition: [contracts, survey-first, survey-second]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore complete product
        run: dotnet restore ${{ env.MAIN_SOLUTION }} --locked-mode ${{ env.DOTNET_CI_ARGS }}

      - name: Build complete product
        run: dotnet build ${{ env.MAIN_SOLUTION }} -c ${{ env.CONFIGURATION }} --no-restore /m:1 /nr:false ${{ env.DOTNET_CI_ARGS }}

      - name: Test built-in initial structure
        run: >-
          pwsh -NoProfile -File scripts/test-initial-structure-partition.ps1
          -Partition ${{ matrix.partition }}
          -Configuration ${{ env.CONFIGURATION }}
          -ResultsDirectory "${{ runner.temp }}/test-results/lab"
          -HangTimeout ${{ env.LAB_TEST_HANG_TIMEOUT }}

      - name: Test built-in coating design
        if: ${{ always() && matrix.partition == 'contracts' }}
        run: >-
          dotnet test
          ${{ env.COATING_TEST_PROJECT }}
          -c ${{ env.CONFIGURATION }}
          --no-build --no-restore
          --logger "trx;LogFileName=coating-${{ matrix.os }}.trx"
          --results-directory "${{ runner.temp }}/test-results/lab"
          --blame-hang --blame-hang-timeout ${{ env.LAB_TEST_HANG_TIMEOUT }}
          /m:1 /nr:false

      - name: Upload built-in module test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-lab-${{ matrix.os }}-${{ matrix.partition }}
          path: ${{ runner.temp }}/test-results/lab
          if-no-files-found: warn

  quality:
    name: Repository quality
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore ${{ env.MAIN_SOLUTION }} --locked-mode ${{ env.DOTNET_CI_ARGS }}

      - name: Verify formatting
        run: dotnet format ${{ env.MAIN_SOLUTION }} --no-restore --verify-no-changes

      - name: Verify immutable release action references
        run: pwsh -NoProfile -File scripts/verify-release-actions.ps1

      - name: Verify initial-structure partition coverage
        run: pwsh -NoProfile -File scripts/tests/test-initial-structure-partition.tests.ps1

      - name: Validate shell scripts
        if: ${{ always() }}
        run: |
          bash -n Run-OpticalSystemDesign.command
          bash -n scripts/publish-cross-platform.sh

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore ${{ env.MAIN_SOLUTION }} --locked-mode ${{ env.DOTNET_CI_ARGS }}

      - name: Audit direct and transitive packages
        if: ${{ always() }}
        run: >-
          dotnet list ${{ env.MAIN_SOLUTION }} package
          --vulnerable --include-transitive --no-restore

  performance-smoke:
    name: Performance smoke
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore ${{ env.MAIN_SOLUTION }} --locked-mode ${{ env.DOTNET_CI_ARGS }}

      - name: Build benchmark tool
        run: >-
          dotnet build
          tools/OpticalSystemDesign.Benchmarks/OpticalSystemDesign.Benchmarks.csproj
          -c ${{ env.CONFIGURATION }}
          --no-restore /m:1 /nr:false ${{ env.DOTNET_CI_ARGS }}

      - name: Run bounded performance smoke
        run: >-
          dotnet run
          --project tools/OpticalSystemDesign.Benchmarks/OpticalSystemDesign.Benchmarks.csproj
          -c ${{ env.CONFIGURATION }}
          --no-build -- --ci-smoke

  step-fixtures:
    name: Generate STEP fixtures
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore ${{ env.MAIN_SOLUTION }} --locked-mode ${{ env.DOTNET_CI_ARGS }}

      - name: Build main solution
        run: dotnet build ${{ env.MAIN_SOLUTION }} -c ${{ env.CONFIGURATION }} --no-restore /m:1 /nr:false ${{ env.DOTNET_CI_ARGS }}

      - name: Generate STEP validation fixtures
        env:
          OPTICAL_SYSTEM_DESIGN_STEP_FIXTURE_DIR: ${{ runner.temp }}/step-fixtures
        run: >-
          dotnet test
          ${{ env.MAIN_TEST_PROJECT }}
          -c ${{ env.CONFIGURATION }}
          --no-build
          --filter FullyQualifiedName~CadExportFreeCadFixtureTests
          --logger "trx;LogFileName=step-fixtures.trx"
          --results-directory "${{ runner.temp }}/test-results/step-fixtures"
          /m:1 /nr:false

      - name: Upload STEP validation fixtures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: step-validation-fixtures
          path: ${{ runner.temp }}/step-fixtures
          if-no-files-found: warn

      - name: Upload STEP fixture test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: step-fixture-test-results
          path: ${{ runner.temp }}/test-results/step-fixtures
          if-no-files-found: warn

  step-validation:
    name: STEP OpenCascade validation
    runs-on: ubuntu-22.04
    needs: step-fixtures
    if: ${{ always() && needs.step-fixtures.result == 'success' }}
    env:
      FREECAD_APT_VERSION: 0.19.2+dfsg1-3ubuntu1
      STEP_VALIDATION_LOG_DIR: ${{ github.workspace }}/step-validation-logs

    steps:
      - uses: actions/checkout@v4

      - name: Download STEP validation fixtures
        uses: actions/download-artifact@v4
        with:
          name: step-validation-fixtures
          path: ${{ runner.temp }}/step-fixtures

      - name: Restore fixed FreeCAD package cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/freecad-debs
          key: freecad-ubuntu-22.04-${{ env.FREECAD_APT_VERSION }}-v1

      - name: Install fixed FreeCAD validation runtime
        shell: bash
        env:
          FREECAD_DEB_CACHE_DIR: ${{ runner.temp }}/freecad-debs
        run: |
          set -euo pipefail
          mkdir -p "$STEP_VALIDATION_LOG_DIR"
          mkdir -p "$FREECAD_DEB_CACHE_DIR"
          packages=(
            freecad
            freecad-common
            freecad-python3
            libfreecad-python3-0.19
          )
          specs=()
          for package in "${packages[@]}"; do
            specs+=("${package}=${FREECAD_APT_VERSION}")
          done
          sudo apt-get update 2>&1 | tee "$STEP_VALIDATION_LOG_DIR/apt-update.log"
          apt-cache policy \
            freecad \
            freecad-common \
            freecad-python3 \
            libfreecad-python3-0.19 \
            | tee "$STEP_VALIDATION_LOG_DIR/freecad-apt-policy.log"
          if ! find "$FREECAD_DEB_CACHE_DIR" -maxdepth 1 -type f -name '*.deb' | grep -q .; then
            (
              cd "$FREECAD_DEB_CACHE_DIR"
              apt-get download "${specs[@]}"
            ) 2>&1 | tee "$STEP_VALIDATION_LOG_DIR/freecad-download.log"
          else
            echo "Using cached FreeCAD deb packages from $FREECAD_DEB_CACHE_DIR" \
              | tee "$STEP_VALIDATION_LOG_DIR/freecad-download.log"
          fi
          sha256sum "$FREECAD_DEB_CACHE_DIR"/*.deb \
            | tee "$STEP_VALIDATION_LOG_DIR/freecad-deb-sha256.log"
          sudo apt-get install --yes --no-install-recommends \
            "$FREECAD_DEB_CACHE_DIR"/*.deb \
            2>&1 | tee "$STEP_VALIDATION_LOG_DIR/freecad-install.log"
          freecad_cmd="$(command -v FreeCADCmd || command -v freecadcmd || true)"
          if [ -z "$freecad_cmd" ]; then
            echo "FreeCAD command-line runtime was not installed." \
              | tee "$STEP_VALIDATION_LOG_DIR/freecad-version.log"
            exit 1
          fi
          {
            echo "Runner image: ubuntu-22.04"
            echo "Pinned FreeCAD apt version: ${FREECAD_APT_VERSION}"
            echo "FreeCAD command: ${freecad_cmd}"
            "$freecad_cmd" --version || true
          } | tee "$STEP_VALIDATION_LOG_DIR/freecad-version.log"

      - name: Validate STEP with OpenCascade
        shell: bash
        env:
          OPTICAL_SYSTEM_DESIGN_STEP_FIXTURE_DIR: ${{ runner.temp }}/step-fixtures
        run: |
          set -euo pipefail
          mkdir -p "$STEP_VALIDATION_LOG_DIR"
          freecad_cmd="$(command -v FreeCADCmd || command -v freecadcmd || true)"
          if [ -z "$freecad_cmd" ]; then
            echo "FreeCAD command-line runtime is not available." \
              | tee "$STEP_VALIDATION_LOG_DIR/opencascade-validation.log"
            exit 1
          fi
          validator_path="$PWD/tools/step_validation/validate_freecad_import.py"
          printf "exec(compile(open(r'%s','rb').read(),r'%s','exec'))\n" \
            "$validator_path" "$validator_path" \
            | "$freecad_cmd" -c 2>&1 \
            | tee "$STEP_VALIDATION_LOG_DIR/opencascade-validation.log"

      - name: Upload STEP validation logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: step-validation-logs
          path: ${{ env.STEP_VALIDATION_LOG_DIR }}
          if-no-files-found: warn
