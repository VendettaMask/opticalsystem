name: Windows release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Require the tag to match the product version
        shell: pwsh
        run: |
          $version = ./scripts/get-product-version.ps1
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag and ProductVersion.props differ.' }
      - name: Restore and build the complete product
        shell: pwsh
        run: |
          dotnet restore OpticalSystemDesign.slnx --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build OpticalSystemDesign.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify version, update discovery, and packaging boundaries
        shell: pwsh
        run: |
          dotnet test tests/OpticalSystemDesign.Tests/OpticalSystemDesign.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~ProductVersionInfoTests|FullyQualifiedName~ReleaseUpdateTests|FullyQualifiedName~SoftwareUpdateWindowTests|FullyQualifiedName~WindowsPackagingTests|FullyQualifiedName~InitialStructureLabLauncherTests|FullyQualifiedName~ProductDependencyArchitectureTests'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify frozen evidence and documentation
        shell: pwsh
        run: |
          ./tools/validation/GitFrozenIntegrity.ps1 -RepositoryRoot . -ManifestPath ./artifacts/validation/n02-layer-diagnosis-20261009/frozen-after.json -ExpectedAggregateSha256 3a5fde98e1c881700f00be1c62d6ab4ff6f4feacc90454046ed787e80bf28c10 -RelocationMapPath tools/validation/frozen-evidence-relocations.json -ExpectedRelocationMapSha256 6eefb25cbb1c35a120f73e8bbb761aac16759e7b8491b4606475caec8dfd4f6e
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/verify-documentation.ps1 -Strict
      - name: Build full unsigned installer and collect distribution assets
        shell: pwsh
        run: |
          $package = ./scripts/build-installer.ps1 -Runtime '${{ matrix.runtime }}' -PassThru
          if ('${{ matrix.runtime }}' -eq 'win-x64') {
            $payload = Get-ChildItem -LiteralPath (Join-Path $package.Directory 'payload') -Directory | Select-Object -First 1 -ExpandProperty FullName
            ./scripts/verify-built-in-package.ps1 -PublishDirectory $payload -OutputDirectory 'artifacts/release-package-verification'
          }
          # ARM64 is cross-published here, not natively executed on the x64 runner.
          New-Item -ItemType Directory -Path distribution | Out-Null
          Copy-Item -LiteralPath $package.Setup, "$($package.Setup).sha256" -Destination distribution
          Copy-Item -LiteralPath (Join-Path $package.Directory 'release.json') -Destination 'distribution/release-${{ matrix.runtime }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.runtime }}
          path: distribution/*
          if-no-files-found: error
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: distribution
          merge-multiple: true
      - name: Create a draft for manual release approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" distribution/* --verify-tag --draft --title "Optical System Design $GITHUB_REF_NAME" --notes "Full Windows installers for x64 and ARM64, including both built-in laboratories. UNSIGNED: publisher identity is not authenticated. Verify SHA-256; close the app and install manually. Automatic online installation is not implemented. Review the normal CI and release assets before publishing this draft as the latest stable release."
