name: Desktop build and publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to update (the tag is not moved)
        required: true
        default: v1.0.4-test.20261019
      runtime:
        description: Desktop platform (Mac supports Apple Silicon only)
        type: choice
        options: [all, win-x64, win-arm64, osx-arm64]
        default: all
      replace_existing:
        description: Replace selected existing installers (other platforms are preserved)
        type: boolean
        default: false
      validation_only:
        description: Run all selected platform checks without packaging or publishing
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      runtimes: ${{ steps.plan.outputs.runtimes }}
      test_package: ${{ steps.plan.outputs.test_package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: plan
        name: Validate version, tag and architecture
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_RUNTIME: ${{ inputs.runtime }}
        run: |
          $version = ./scripts/get-product-version.ps1
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_TAG } else { $env:GITHUB_REF_NAME }
          $test = $tag -cmatch ('^v' + [regex]::Escape($version) + '-test\.[0-9]{8}$')
          if (-not $test -and $tag -cne "v$version") { throw 'Tag and ProductVersion.props differ.' }
          $runtimes = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:REQUESTED_RUNTIME -ne 'all') { @($env:REQUESTED_RUNTIME) } else { @('win-x64', 'win-arm64', 'osx-arm64') }
          foreach ($runtime in $runtimes) { if ($runtime -notin @('win-x64', 'win-arm64', 'osx-arm64')) { throw 'Unsupported architecture.' } }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "runtimes=$($runtimes | ConvertTo-Json -Compress -AsArray)" >> $env:GITHUB_OUTPUT
          "test_package=$($test.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  package:
    needs: plan
    runs-on: ${{ matrix.runtime == 'osx-arm64' && 'macos-15' || 'windows-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.plan.outputs.runtimes) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore and build the complete product
        shell: pwsh
        run: |
          dotnet restore OpticalSystemDesign.slnx --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build OpticalSystemDesign.slnx -c Release --no-restore /m:1 /nr:false -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify release and installation boundaries
        if: matrix.runtime != 'osx-arm64'
        shell: pwsh
        run: |
          ./scripts/test-ota-key-crypto.ps1
          dotnet test tests/OpticalSystemDesign.Tests/OpticalSystemDesign.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~ProductVersionInfoTests|FullyQualifiedName~ReleaseUpdateTests|FullyQualifiedName~AboutUpdateTests|FullyQualifiedName~OtaClientTests|FullyQualifiedName~OtaHelperRuntimeTests|FullyQualifiedName~WindowsInstallationGateTests|FullyQualifiedName~WindowsInstallationLifetimeTests|FullyQualifiedName~OtaUpdatePanelTests|FullyQualifiedName~OtaShutdownGuardTests|FullyQualifiedName~WindowsPackagingTests|FullyQualifiedName~CloudReleaseTests|FullyQualifiedName~InitialStructureLabLauncherTests|FullyQualifiedName~ProductDependencyArchitectureTests' --logger 'trx;LogFileName=release.trx' --results-directory artifacts/cloud-verification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test labs/InitialStructure/tests/OpticalSystemDesign.InitialStructure.Tests/OpticalSystemDesign.InitialStructure.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~FlatStartDesktopTests|FullyQualifiedName~AutoLensOfficialExampleTests' --logger 'trx;LogFileName=initial-structure.trx' --results-directory artifacts/cloud-verification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify Apple Silicon packaging and shared product boundaries
        if: matrix.runtime == 'osx-arm64'
        shell: pwsh
        run: |
          dotnet test tests/OpticalSystemDesign.Tests/OpticalSystemDesign.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~ProductVersionInfoTests|FullyQualifiedName~CloudReleaseTests|FullyQualifiedName~MacPackagingTests|FullyQualifiedName~InitialStructureLabLauncherTests|FullyQualifiedName~ProductDependencyArchitectureTests' --logger 'trx;LogFileName=macos-release.trx' --results-directory artifacts/cloud-verification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test labs/InitialStructure/tests/OpticalSystemDesign.InitialStructure.Tests/OpticalSystemDesign.InitialStructure.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~FlatStartDesktopTests|FullyQualifiedName~AutoLensOfficialExampleTests' --logger 'trx;LogFileName=initial-structure.trx' --results-directory artifacts/cloud-verification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify lens headers and 2D/3D viewers
        shell: pwsh
        run: |
          # Real Skia navigation and drawing stubs must not share glyph caches.
          ./scripts/test-lens-navigation-release.ps1 -ResultsDirectory artifacts/cloud-verification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test tests/OpticalSystemDesign.Tests/OpticalSystemDesign.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~LensEditorLayoutTests|FullyQualifiedName~LensHeaderTypographyTests|FullyQualifiedName~LensMaterialRowThemeTests|FullyQualifiedName~ViewerSettingsInputThemeTests|FullyQualifiedName~ViewerConfigurationTests|FullyQualifiedName~Viewer3DGeometryTests' --logger 'trx;LogFileName=lens-viewers.trx' --results-directory artifacts/cloud-verification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Render update check feedback in three languages
        shell: pwsh
        env:
          OPTICAL_SYSTEM_DESIGN_UPDATE_CAPTURE_DIR: ${{ github.workspace }}/artifacts/cloud-verification/update-feedback
        run: |
          dotnet test tests/OpticalSystemDesign.Tests/OpticalSystemDesign.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~AboutUpdateTests.CheckButtonShowsBusyProgressAndPersistentLocalizedResults' --logger 'trx;LogFileName=update-feedback-render.trx' --results-directory artifacts/cloud-verification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify readable analysis pages and captions
        shell: pwsh
        run: |
          dotnet test tests/OpticalSystemDesign.Tests/OpticalSystemDesign.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~AnalysisResponsivePlotTests|FullyQualifiedName~AnalysisGuiContractTests|FullyQualifiedName~AccessibilityAndResponsiveLayoutTests|FullyQualifiedName~AnalysisLegendLayoutTests|FullyQualifiedName~FieldCurvatureFooterTests|FullyQualifiedName~InterferogramFooterTests|FullyQualifiedName~RayFanFooterTests|FullyQualifiedName~SpotTitleLayoutTests|FullyQualifiedName~RayFanLayoutRepairTests|FullyQualifiedName~ConfigurationMatrixAnalysisGuiTests|FullyQualifiedName~AnalysisConfigurationSelectionGuiTests|FullyQualifiedName~SeidelReportPresentationTests|FullyQualifiedName~WavefrontSurfaceRenderTests|FullyQualifiedName~ProductTypographyTests|FullyQualifiedName~PupilShapeAndFoucaultPanelTests|FullyQualifiedName~PupilFoucaultExtensionPanelTests' --logger 'trx;LogFileName=analysis-contracts.trx' --results-directory artifacts/cloud-verification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Render complete analysis pages in an isolated Skia process
        shell: pwsh
        env:
          OPTICAL_SYSTEM_DESIGN_ANALYSIS_FIT_CAPTURE_DIR: ${{ github.workspace }}/artifacts/cloud-verification/analysis-pages
        run: |
          dotnet test tests/OpticalSystemDesign.Tests/OpticalSystemDesign.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~AnalysisResponsivePlotTests' --logger 'trx;LogFileName=analysis-render.trx' --results-directory artifacts/cloud-verification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify complete PNG export in an isolated Skia process
        shell: pwsh
        env:
          OPTICAL_SYSTEM_DESIGN_ANALYSIS_EXPORT_CAPTURE_DIR: ${{ github.workspace }}/artifacts/cloud-verification/analysis-export
        run: |
          dotnet test tests/OpticalSystemDesign.Tests/OpticalSystemDesign.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~AnalysisImageExportTests' --logger 'trx;LogFileName=analysis-export.trx' --results-directory artifacts/cloud-verification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify frozen evidence and documentation
        shell: pwsh
        run: |
          ./tools/validation/GitFrozenIntegrity.ps1 -RepositoryRoot . -ManifestPath ./artifacts/validation/n02-layer-diagnosis-20261009/frozen-after.json -ExpectedAggregateSha256 3a5fde98e1c881700f00be1c62d6ab4ff6f4feacc90454046ed787e80bf28c10 -RelocationMapPath tools/validation/frozen-evidence-relocations.json -ExpectedRelocationMapSha256 6eefb25cbb1c35a120f73e8bbb761aac16759e7b8491b4606475caec8dfd4f6e -OutputPath artifacts/cloud-verification/frozen.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/verify-documentation.ps1 -Strict -OutputPath artifacts/cloud-verification/documentation.json
      - name: Build the complete self-contained EXE installer
        if: ${{ matrix.runtime != 'osx-arm64' && !inputs.validation_only }}
        shell: pwsh
        env:
          TARGET_RUNTIME: ${{ matrix.runtime }}
          TEST_PACKAGE: ${{ needs.plan.outputs.test_package }}
        run: |
          $package = ./scripts/build-installer.ps1 -Runtime $env:TARGET_RUNTIME -UnsignedTestPackage:($env:TEST_PACKAGE -eq 'true') -PassThru
          if ($env:TARGET_RUNTIME -eq 'win-x64') {
            $payload = Get-ChildItem -LiteralPath (Join-Path $package.Directory 'payload') -Directory | Select-Object -First 1 -ExpandProperty FullName
            ./scripts/verify-built-in-package.ps1 -PublishDirectory $payload -OutputDirectory artifacts/cloud-package-verification
            $env:OPTICAL_SYSTEM_DESIGN_OTA_RUNTIME_SOURCE = $payload
            dotnet test tests/OpticalSystemDesign.Tests/OpticalSystemDesign.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~OtaHelperRuntimeTests' --logger 'trx;LogFileName=ota-runtime-package.trx' --results-directory artifacts/cloud-verification
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Remove-Item Env:OPTICAL_SYSTEM_DESIGN_OTA_RUNTIME_SOURCE
          }
          # Internal Actions handoff only. Publishing filters out these build records.
          New-Item -ItemType Directory -Path distribution | Out-Null
          Copy-Item -LiteralPath $package.Setup -Destination distribution
          Copy-Item -LiteralPath (Join-Path $package.Directory 'release.json') -Destination "distribution/release-$env:TARGET_RUNTIME.json"
          Get-FileHash -LiteralPath $package.Setup -Algorithm SHA256 | Format-List
      - name: Build and verify the self-contained Apple Silicon DMG
        if: ${{ matrix.runtime == 'osx-arm64' && !inputs.validation_only }}
        shell: bash
        env:
          TEST_PACKAGE: ${{ needs.plan.outputs.test_package }}
        run: |
          options=()
          if [[ "$TEST_PACKAGE" == true ]]; then options+=(--test-package); fi
          bash scripts/build-macos.sh --output-root artifacts/cloud-macos "${options[@]}"
          package_dir="$(find artifacts/cloud-macos -mindepth 1 -maxdepth 1 -type d ! -name '*.partial')"
          test -n "$package_dir"
          mkdir -p distribution artifacts/cloud-package-verification
          cp "$package_dir"/*.dmg "$package_dir/release-osx-arm64.json" distribution/
          cp "$package_dir/verification/"*.json artifacts/cloud-package-verification/
          for report in "$package_dir/dmg-verification/"*.json; do
            cp "$report" "artifacts/cloud-package-verification/dmg-$(basename "$report")"
          done
          shasum -a 256 distribution/*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !inputs.validation_only }}
        with:
          name: cloud-package-${{ matrix.runtime }}
          path: distribution/*
          if-no-files-found: error
          retention-days: 30
      - name: Retain authorized bounded cloud Mac test crash reports
        if: ${{ failure() && matrix.runtime == 'osx-arm64' }}
        shell: bash
        run: |
          # User authorized temporary GitHub Mac test reports on 2026-10-27.
          # No reports or files from the maintainer's own computer are read.
          mkdir -p artifacts/cloud-verification/native-crash
          count=0
          sleep 2
          for directory in "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Logs/DiagnosticReports/Retired"; do
            for report in "$directory"/{testhost,dotnet}*.{ips,crash}; do
              [[ -f "$report" ]] || continue
              if [[ $(stat -f%z "$report") -le 20971520 && $count -lt 5 ]]; then
                cp "$report" artifacts/cloud-verification/native-crash/
                count=$((count+1))
              fi
            done
          done
      - name: Retain validation records inside Actions, not release attachments
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-checks-${{ matrix.runtime }}
          path: |
            artifacts/cloud-verification
            artifacts/cloud-package-verification/*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: ${{ !inputs.validation_only }}
    needs: [plan, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cloud-package-*
          path: distribution
          merge-multiple: true
      - name: Verify and publish EXE and Apple Silicon DMG installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OPTICAL_OTA_SIGNING_KEY: ${{ secrets.OPTICAL_OTA_SIGNING_KEY }}
          OPTICAL_OTA_ENCRYPTED_BACKUP: ${{ secrets.OPTICAL_OTA_ENCRYPTED_BACKUP }}
          OPTICAL_OTA_RECOVERY_PASSWORD: ${{ secrets.OPTICAL_OTA_RECOVERY_PASSWORD }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          REPLACE_EXISTING: ${{ inputs.replace_existing || false }}
        run: |
          ./scripts/publish-github-exe.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -DistributionDirectory distribution -ReplaceExisting:($env:REPLACE_EXISTING -eq 'true') -NotesFile packaging/windows/RELEASE_NOTES.md
      - name: Retain replacement receipts and previous assets inside Actions
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-release-receipt
          path: distribution/release-evidence
          if-no-files-found: warn
          retention-days: 30
