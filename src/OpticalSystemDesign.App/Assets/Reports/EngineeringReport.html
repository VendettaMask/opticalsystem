.full-toc{margin-top:22px}.full-toc .toc-entry{padding:9px 0;font-size:12px;line-height:1.4}.full-toc .toc-page{font-size:11px}.toc-warning{color:#8d6650;font-size:9px;margin-left:9px}.summary-spec{margin-top:28px}.full-table{table-layout:fixed}.full-table th{white-space:normal;text-align:left;overflow-wrap:anywhere}.full-table td{font-family:inherit;text-align:left;overflow-wrap:anywhere;line-height:1.6;padding:10px 9px}.full-table td:last-child{font-variant-numeric:tabular-nums}.coefficient-table th,.coefficient-table td{padding:10px 12px;text-align:right;font-family:var(--mono)}.coefficient-table td:first-child,.coefficient-table th:first-child{text-align:left}.coefficient-table th:first-child{width:20%}.raw-item{margin:0 0 15px;border-bottom:1px solid var(--line);padding-bottom:15px}.raw-item summary{cursor:pointer;font-size:14px;font-weight:500;color:#3f596d;padding:7px 0}.unavailable-box{padding:23px 26px;background:#f7f5f1;border:1px solid #e5ddd2;color:#705f4c;font-size:13px;overflow-wrap:anywhere}.unavailable-box p{margin-bottom:0}.analysis-intro .condition-row{flex-wrap:nowrap;gap:16px;line-height:1.5}.condition-row>div{overflow-wrap:anywhere;max-width:40%}.page-title{font-size:25px}.analysis-notes dd{overflow-wrap:anywhere}.toolbar-title small{white-space:nowrap}.toc-page .page-description{margin-bottom:0}

<body>
<header class="viewer-tools"><button type="button" class="mobile-outline-toggle" id="outline-toggle" aria-label="@@UI_A@@" aria-expanded="false">☰</button><div class="toolbar-brand">@@TOOLBAR_LOGO@@</div><div class="toolbar-title">@@REPORT_TITLE@@<small>@@SNAPSHOT@@</small></div><div class="toolbar-actions"><div class="page-controls" aria-label="@@UI_B@@"><button type="button" id="previous-page" aria-label="@@UI_C@@">‹</button><span><output id="current-page">01</output> / @@PAGE_COUNT@@</span><button type="button" id="next-page" aria-label="@@UI_D@@">›</button></div><button type="button" class="toolbar-link records-trigger" id="records-trigger">@@UI_E@@</button><button type="button" class="toolbar-print" id="print-report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 9V3h12v6M6 17H3V9h18v8h-3M6 14h12v7H6z"/></svg><span class="print-text">@@UI_F@@</span></button></div></header>
<div class="top-progress" id="reading-progress"></div>
<div class="reader"><aside class="outline" id="outline" aria-label="@@UI_G@@"><div class="outline-head"><div class="small-label">@@UI_G@@</div><h2>@@REPORT_NAME@@</h2><p>@@CONFIGURATION_NOTE@@</p></div><nav>@@NAVIGATION@@</nav><div class="outline-note">@@OUTLINE_NOTE@@</div></aside><main class="canvas" id="report-pages">@@PAGES@@</main></div>
<dialog class="modal" id="image-dialog" aria-labelledby="image-dialog-title"><div class="modal-header"><span class="modal-title" id="image-dialog-title">@@UI_H@@</span><div class="modal-actions"><button type="button" class="plain-button" id="native-size" aria-pressed="false">@@UI_I@@</button><button type="button" class="close-modal" data-close="image-dialog" aria-label="@@UI_J@@">×</button></div></div><div class="image-stage" id="image-stage"><img id="dialog-image" alt=""></div></dialog>
<dialog class="modal records-modal" id="records-dialog" aria-labelledby="records-title"><div class="modal-header"><span class="modal-title" id="records-title">@@UI_K@@ · @@REPORT_NAME@@</span><button type="button" class="close-modal" data-close="records-dialog" aria-label="@@UI_L@@">×</button></div><div class="records-content">@@RAW_RECORDS@@</div></dialog>

<script>
(()=>{
 const pages=[...document.querySelectorAll('.document-page')],links=[...document.querySelectorAll('.outline nav a')],outline=document.getElementById('outline');
 let current=1;
 const mark=number=>{current=number;document.getElementById('current-page').textContent=String(number).padStart(2,'0');document.getElementById('reading-progress').style.width=(number/pages.length*100)+'%';document.getElementById('previous-page').disabled=number===1;document.getElementById('next-page').disabled=number===pages.length;links.forEach(link=>{if(Number(link.dataset.page)===number)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});};
 const go=number=>{if(number<1||number>pages.length)return;mark(number);pages[number-1].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});};
 document.getElementById('previous-page').addEventListener('click',()=>go(current-1));document.getElementById('next-page').addEventListener('click',()=>go(current+1));
 links.forEach(link=>link.addEventListener('click',()=>{mark(Number(link.dataset.page));outline.classList.remove('is-open');document.getElementById('outline-toggle').setAttribute('aria-expanded','false');}));
 if('IntersectionObserver' in window){const observer=new IntersectionObserver(items=>{const visible=items.filter(item=>item.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(visible.length)mark(Number(visible[0].target.dataset.page));},{rootMargin:'-80px 0px -65% 0px',threshold:0});pages.forEach(page=>observer.observe(page));}mark(1);
 const outlineToggle=document.getElementById('outline-toggle');outlineToggle.addEventListener('click',()=>outlineToggle.setAttribute('aria-expanded',String(outline.classList.toggle('is-open'))));
 document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>document.getElementById(button.dataset.close).close()));
 document.getElementById('records-trigger').addEventListener('click',()=>document.getElementById('records-dialog').showModal());
 const dialog=document.getElementById('image-dialog'),image=document.getElementById('dialog-image'),stage=document.getElementById('image-stage'),nativeSize=document.getElementById('native-size');
 document.querySelectorAll('[data-figure]').forEach(button=>button.addEventListener('click',()=>{const source=document.getElementById(button.dataset.figure);image.src=source.src;image.alt=source.alt;document.getElementById('image-dialog-title').textContent=source.dataset.title;stage.classList.remove('is-native');nativeSize.setAttribute('aria-pressed','false');nativeSize.textContent='@@UI_I@@';dialog.showModal();}));
 nativeSize.addEventListener('click',()=>{const active=stage.classList.toggle('is-native');nativeSize.setAttribute('aria-pressed',String(active));nativeSize.textContent=active?'@@UI_M@@':'@@UI_I@@';});
 document.getElementById('print-report').addEventListener('click',()=>window.print());
})();
</script>
</body>
</html>
