<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="几何图像分析" data-icon-finish="Lumen"><title>几何图像分析</title><defs><linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="32" y2="32"><stop offset="0" stop-color="#A2BDCC" /><stop offset=".42" stop-color="#456878" /><stop offset=".66" stop-color="#A3BAC6" /><stop offset="1" stop-color="#4D6D7B" /></linearGradient><filter id="signal-glow" filterUnits="userSpaceOnUse" x="-2" y="-2" width="36" height="36"><feGaussianBlur stdDeviation=".5" result="soft" /><feMerge><feMergeNode in="soft" /><feMergeNode in="SourceGraphic" /></feMerge></filter></defs><style>.structure{fill:none;stroke:url(#steel)}.signal{fill:none;stroke:#78DCFF}.secondary{fill:none;stroke:#C4F5FF}.signal-fill{fill:#78DCFF;stroke:none}.secondary-fill{fill:#D6AC6B;stroke:none}.hot-fill{fill:#E2FBFF;stroke:none}.glyph{stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.signal{filter:url(#signal-glow)}</style><g class="glyph"><path class="structure" d="M12 4v24M28 5v23" /><circle class="secondary-fill" cx="4" cy="8" r="1.5" /><path class="signal" d="M4 8 12 9 27 18M4 8l8 8 15 5" /><circle class="signal-fill" cx="27" cy="18" r="1.2" /><circle class="signal-fill" cx="27" cy="21" r="1.2" /></g></svg>
