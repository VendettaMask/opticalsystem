<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五主题图标实际预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f4ece5;font:16px/1.7 'Microsoft YaHei UI','Microsoft YaHei',sans-serif}main{max-width:1540px;margin:30px auto;padding:0 24px}h1{font-size:29px;margin:0 0 8px}p{color:#c8bbaf}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0}button,select{font:inherit;border:1px solid #44382f;background:#1d1916;color:#f4ece5;padding:6px 13px;border-radius:6px;cursor:pointer}button[aria-pressed=true]{border-color:#f0ae79;color:#f0ae79}img{max-width:100%;height:auto;border:1px solid #44382f}h2{font-size:20px;margin:28px 0 13px}a{color:#f0ae79}button:focus-visible,select:focus-visible{outline:2px solid #ffd0a6;outline-offset:3px}footer{margin:25px 0;color:#c8bbaf;font-size:14px}</style>
<main><h1>五主题图标实际预览</h1><p>全程序采用 Optical Scientific Outline 1.1，并按主题映射结构、主信息和辅助色。以下均为实际应用离屏绘制。</p><div class="controls"><button type="button" data-theme="Light" aria-pressed="false">普通模式</button><button type="button" data-theme="Dark" aria-pressed="true">黑洞暗夜</button><button type="button" data-theme="Lumen" aria-pressed="false">光域</button><button type="button" data-theme="Isekai" aria-pressed="false">异世界</button><button type="button" data-theme="Pixel" aria-pressed="false">像素风格</button><label>工作台字号 <select id="font"><option>13</option><option selected>18</option></select></label></div><h2 id="heading">黑洞暗夜</h2><a id="full" href="previews/workbench-Dark-18.png"><img id="workbench" src="previews/workbench-Dark-18.png" alt="黑洞暗夜实际工作台"></a><h2>原生图标图集</h2><p>每个图标按 18、24、32 DIP 显示，包含确认稿及常用文件、搜索、视图和操作图标。</p><a id="atlasLink" href="previews/atlas-Dark.png"><img id="atlas" src="previews/atlas-Dark.png" alt="黑洞暗夜原生图标图集"></a><footer><a href="README.md">验证范围</a> · <a href="theme-overview.png">五主题工具栏总览</a> · 最终定向回归 53/53 通过</footer></main>
<script>let current='Dark';const names={"Light": "普通模式", "Dark": "黑洞暗夜", "Lumen": "光域", "Isekai": "异世界", "Pixel": "像素风格"};function update(){const name=names[current],file='previews/workbench-'+current+'-'+document.querySelector('#font').value+'.png',atlas='previews/atlas-'+current+'.png';document.querySelector('#workbench').src=file;document.querySelector('#workbench').alt=name+'实际工作台';document.querySelector('#full').href=file;document.querySelector('#atlas').src=atlas;document.querySelector('#atlas').alt=name+'原生图标图集';document.querySelector('#atlasLink').href=atlas;document.querySelector('#heading').textContent=name;document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===current)))}document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{current=b.dataset.theme;update()});document.querySelector('#font').onchange=update;</script></html>
